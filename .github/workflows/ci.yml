name: CI

on:
  push:
  pull_request:

# Pinned rather than ubuntu-latest so compiler versions only change when we
# choose to upgrade, never underneath a milestone.
jobs:
  test:
    name: test (${{ matrix.cc }}, ${{ matrix.build }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        build: [debug, release]
    steps:
      - uses: actions/checkout@v5
      - name: Install clang sanitizer runtime
        if: matrix.cc == 'clang'
        run: |
          sudo apt-get update
          sudo apt-get install -y "libclang-rt-$(clang -dumpversion | cut -d. -f1)-dev"
      - name: Build and test
        run: make CC=${{ matrix.cc }} BUILD=${{ matrix.build }} test

  corpus:
    name: corpus (Canterbury, sanitizers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Round-trip the Canterbury corpus
        run: make corpus

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check formatting
        run: make format-check
